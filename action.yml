name: sca-triage
description: "npm SCA gate: rank vulnerable dependencies by severity and whether your code loads them, and fail the build at the priority you choose (P1 by default)."
branding:
  icon: shield
  color: red
inputs:
  path:
    description: Directory containing package.json and package-lock.json (v2 or v3)
    default: .
  fail-on:
    description: Lowest priority that fails the build (P1, P2, P3 or none)
    default: P1
runs:
  using: composite
  steps:
    - name: Scan dependencies
      shell: bash
      env:
        SCA_PATH: ${{ inputs.path }}
        SCA_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        rm -f "$RUNNER_TEMP/sca-triage.md"
        # The output includes names from the scanned project: stop workflow commands while it prints.
        token="sca-triage-$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
        echo "::stop-commands::$token"
        set +e
        node "$GITHUB_ACTION_PATH/bin/sca-triage.js" scan "$SCA_PATH" --fail-on "$SCA_FAIL_ON" --markdown "$RUNNER_TEMP/sca-triage.md"
        code=$?
        set -e
        echo "::$token::"
        [ -f "$RUNNER_TEMP/sca-triage.md" ] && cat "$RUNNER_TEMP/sca-triage.md" >> "$GITHUB_STEP_SUMMARY"
        exit $code
